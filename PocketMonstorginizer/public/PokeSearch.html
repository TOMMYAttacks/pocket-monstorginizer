<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>PokeSearch</title>
	<link rel="stylesheet" href="PokeSearch.css">
</head>
<body>

	<div class="Main">
	
		<h1 id="PokeName"> Pokémon Searcher</h1>
		
		<img id="PokeImg" alt="Pokemon Image" src="" style="display: none; width: 130px; height: 130px">
		
		<p id="PokeInfo">Type in a name of a Pokémon, and you will see some data on it!</p>
		
		<p>
			<code id="TypeA">TypeA</code><code id="TypeB">/TypeB</code> 
		</p>
		<p>
			<code id="Grouping">Grouping</code>
		</p>
		
		<p>
			<code id="IDNum">#0000</code> | 
			<code id="PokeGen">Generation</code>
		</p>

		<p>
			| <code id="PokeEvoStage">Evo Stage</code> | 
			<code id="PokeEvoLineType">Evo Line Type</code> |
			<code id="PokeEvoDoesBranch">Evo Branch?</code> |
		</p>
		
		<p>
			| </code><code id="PokeColor">Color</code> | 
			<code id="PokeShape">Shape</code> |
		</p>
		<p>
			| <code id="PokeEggGroup1">Egg</code><code id="PokeEggGroup2">Groups</code>  |
			<code id="PokeGenderRate">GenderRate</code> | 
		<p>
			<input type="text" id = "PokeSearch" placeholder="Enter Pokemon name">
			<button id="enter" style="width: 103px; height: 26px"> Search</button>
		</p>
		
		<p>Bulbapedia: 
			<a id="BulbaLink" href = ""></a></p>
		<p>Smogon Page:
			<a id="SmogLink" href = ""></a></p>
	
	
	
	
	
	</div>
	<script type="text/javascript" src="PokeSearch.js"></script>
</body>
</html>
