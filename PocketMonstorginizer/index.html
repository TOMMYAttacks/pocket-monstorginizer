<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeSearch</title>
    <link rel="stylesheet" href="PokeSearch.css">
</head>
<body>

    <div class="Main">
        <h1 id="PokeName">Pokémon Searcher</h1>
        <img id="PokeImg" alt="Pokemon Image" src="" style="display: none; width: 130px; height: 130px">
        <p id="PokeInfo">A tool for searching Pokémon! Type in a name of a Pokémon species, and you will see all sorts of info on it!</p>

        <p>
            <code id="TypeA">TypeA</code><code id="TypeB">/TypeB</code> 
        </p>
        <p>
            <code id="Grouping">Grouping</code>
        </p>
        
        <p>
            <code id="IDNum">#0000</code> | 
            <code id="PokeGen">Generation</code>
        </p>

        <p>
            <input type="text" id="PokeSearch" placeholder="Enter Pokémon name">
            <button id="enter" style="width: 103px; height: 26px">Search</button>
        </p>

        <p>Bulbapedia: 
            <a id="BulbaLink" href=""></a>
        </p>
        <p>Smogon Page:
            <a id="SmogLink" href=""></a>
        </p>
    </div>

    <!-- Link the JavaScript files as modules -->
    <script type="module" src="index.js"></script>
</body>
</html>
